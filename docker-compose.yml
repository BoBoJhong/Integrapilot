# 範例：本機開發／部署；預設僅掛載 reports。
# 若需 /projA、/projB，請取消註解 volumes 並改成你的主機路徑（見 README）。
services:
  web:
    build: .
    image: integrapilot
    container_name: integrapilot-web
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://integrapilot:integrapilot@db:5432/integrapilot}
    volumes:
      - "./reports:/app/reports"
      - "./projA:/projA"
      - "./projB:/projB"
  db:
    image: postgres:16
    container_name: integrapilot-db
    environment:
      - POSTGRES_DB=integrapilot
      - POSTGRES_USER=integrapilot
      - POSTGRES_PASSWORD=integrapilot
    volumes:
      - "./.pgdata:/var/lib/postgresql/data"
