# 範例：本機開發／部署；預設僅掛載 reports。
# 若需 /projA、/projB，請取消註解 volumes 並改成你的主機路徑（見 README）。
services:
  web:
    build: .
    image: integrapilot
    container_name: integrapilot-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - "./reports:/app/reports"
      # - "C:/path/to/projA:/projA"
      # - "C:/path/to/projB:/projB"
